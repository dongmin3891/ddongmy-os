<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">ddongmy 상세 아키텍처</title>
  <desc id="desc">GitOps 배포 흐름과 홈서버 K3s 내부의 ingress, service, workload, secret, network policy, RBAC 구성을 보여주는 상세 아키텍처</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5eead4"/>
    </marker>
    <style>
      .title{font:700 39px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.section{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1;letter-spacing:1.5px}.cluster-title{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5eead4}.ns-title{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#93c5fd}.node-title{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc;text-anchor:middle}.node-sub{font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8;text-anchor:middle}.tiny{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8;text-anchor:middle}.panel{fill:#0f172a;fill-opacity:.7;stroke:#26344c;stroke-width:1.2}.cluster{fill:#0b1927;stroke:#2dd4bf;stroke-width:1.7}.namespace{fill:#101a2c;stroke:#334155;stroke-width:1.2}.card{fill:#162238;stroke:#334155;stroke-width:1.4;filter:url(#shadow)}.blue{fill:#142641;stroke:#60a5fa;stroke-width:1.6;filter:url(#shadow)}.cyan{fill:#102b35;stroke:#2dd4bf;stroke-width:1.7;filter:url(#shadow)}.violet{fill:#25223a;stroke:#8b7bb8;stroke-width:1.4;filter:url(#shadow)}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flow{fill:none;stroke:#5eead4;stroke-width:2.5;marker-end:url(#arrow-cyan)}.dash{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1280" rx="28" fill="url(#bg)"/>
  <rect x="54" y="40" width="7" height="72" rx="3.5" fill="url(#accent)"/>
  <text x="84" y="77" class="title">ddongmy · Detailed Architecture</text>
  <text x="84" y="106" class="subtitle">GitOps 배포부터 K3s 내부의 트래픽·워크로드·보안 경계까지</text>

  <!-- Delivery -->
  <rect x="48" y="142" width="1704" height="218" rx="24" class="panel"/>
  <text x="78" y="178" class="section">CODE DELIVERY · GITOPS</text>

  <rect x="78" y="218" width="170" height="88" rx="17" class="card"/>
  <text x="163" y="253" class="node-title">로컬 개발</text><text x="163" y="278" class="node-sub">ddongmy-os</text>
  <rect x="294" y="218" width="160" height="88" rx="17" class="card"/>
  <text x="374" y="253" class="node-title">GitHub</text><text x="374" y="278" class="node-sub">main branch</text>
  <rect x="500" y="208" width="210" height="108" rx="18" class="blue"/>
  <text x="605" y="248" class="node-title">GitHub Actions</text><text x="605" y="274" class="node-sub">Buildx · web + exporter</text><text x="605" y="296" class="node-sub">manifest SHA 갱신</text>
  <rect x="756" y="190" width="185" height="74" rx="16" class="card"/>
  <text x="848" y="222" class="node-title">GHCR</text><text x="848" y="246" class="node-sub">commit SHA images</text>
  <rect x="756" y="278" width="185" height="62" rx="16" class="card"/>
  <text x="848" y="304" class="node-title">GitHub · k8s/</text><text x="848" y="325" class="node-sub">ops commit</text>
  <rect x="987" y="208" width="205" height="108" rx="18" class="blue"/>
  <text x="1089" y="246" class="node-title">Argo CD</text><text x="1089" y="272" class="node-sub">auto sync · prune</text><text x="1089" y="294" class="node-sub">selfHeal</text>
  <rect x="1238" y="208" width="205" height="108" rx="18" class="cyan"/>
  <text x="1340" y="247" class="node-title">홈서버 K3s</text><text x="1340" y="274" class="node-sub">default namespace</text><text x="1340" y="296" class="node-sub">RollingUpdate</text>

  <path d="M248 262H294" class="edge"/><text x="271" y="247" class="tiny">push</text>
  <path d="M454 262H500" class="edge"/>
  <path d="M710 238H756" class="edge"/><text x="733" y="222" class="tiny">push</text>
  <path d="M710 286C730 286 730 309 756 309" class="edge"/>
  <path d="M941 309C963 309 963 282 987 282" class="edge"/><text x="963" y="324" class="tiny">watch</text>
  <path d="M1192 262H1238" class="flow"/>
  <path d="M941 227C1115 166 1275 174 1322 208" class="dash"/><text x="1130" y="184" class="tiny">image pull</text>

  <!-- Detailed system -->
  <rect x="48" y="388" width="1704" height="838" rx="24" class="panel"/>
  <text x="78" y="424" class="section">RUNTIME · K3s INTERNALS</text>

  <!-- External services -->
  <rect x="78" y="458" width="270" height="714" rx="20" class="namespace"/>
  <text x="98" y="486" class="ns-title">EXTERNAL</text>

  <rect x="105" y="520" width="215" height="74" rx="16" class="violet"/>
  <text x="212" y="552" class="node-title">방문자</text><text x="212" y="576" class="node-sub">Browser</text>
  <rect x="105" y="632" width="215" height="78" rx="16" class="blue"/>
  <text x="212" y="665" class="node-title">Cloudflare</text><text x="212" y="689" class="node-sub">DNS · Proxy · TLS</text>
  <rect x="105" y="766" width="215" height="82" rx="16" class="violet"/>
  <text x="212" y="800" class="node-title">Notion</text><text x="212" y="825" class="node-sub">CMS · API · Webhook</text>
  <rect x="105" y="930" width="215" height="78" rx="16" class="blue"/>
  <text x="212" y="963" class="node-title">Cloudflare CDN</text><text x="212" y="987" class="node-sub">cdn.ddongmy.com</text>
  <rect x="105" y="1044" width="215" height="82" rx="16" class="violet"/>
  <text x="212" y="1078" class="node-title">Cloudflare R2</text><text x="212" y="1103" class="node-sub">WebP · immutable</text>

  <!-- K3s boundary -->
  <rect x="382" y="458" width="1338" height="714" rx="22" class="cluster"/>
  <text x="407" y="489" class="cluster-title">HOME SERVER · K3s CLUSTER</text>
  <text x="1210" y="486" class="tiny">LEGEND</text>
  <circle cx="1270" cy="482" r="6" fill="#2dd4bf"/><text x="1335" y="486" class="tiny">runtime workload</text>
  <circle cx="1420" cy="482" r="6" fill="#60a5fa"/><text x="1470" y="486" class="tiny">platform</text>
  <circle cx="1540" cy="482" r="6" fill="#8b7bb8"/><text x="1620" y="486" class="tiny">external · security</text>

  <!-- Cluster platform -->
  <rect x="414" y="522" width="238" height="204" rx="18" class="namespace"/>
  <text x="434" y="550" class="ns-title">namespace · argocd</text>
  <rect x="438" y="580" width="190" height="104" rx="16" class="blue"/>
  <text x="533" y="616" class="node-title">Argo Controller</text><text x="533" y="642" class="node-sub">Application: ddongmy-os</text><text x="533" y="664" class="node-sub">desired state sync</text>

  <rect x="414" y="752" width="238" height="156" rx="18" class="namespace"/>
  <text x="434" y="780" class="ns-title">namespace · kube-system</text>
  <rect x="438" y="800" width="190" height="80" rx="16" class="card"/>
  <text x="533" y="833" class="node-title">Traefik</text><text x="533" y="858" class="node-sub">Ingress Controller</text>
  <rect x="438" y="1014" width="190" height="88" rx="16" class="card"/>
  <text x="533" y="1050" class="node-title">Kubernetes API</text><text x="533" y="1076" class="node-sub">cluster control plane</text>

  <!-- Default namespace -->
  <rect x="684" y="522" width="1004" height="610" rx="18" class="namespace"/>
  <text x="706" y="550" class="ns-title">namespace · default</text>

  <rect x="720" y="586" width="202" height="96" rx="16" class="blue"/>
  <text x="821" y="620" class="node-title">web-ingress</text><text x="821" y="645" class="node-sub">host: ddongmy.com</text><text x="821" y="666" class="node-sub">class: traefik</text>
  <rect x="720" y="714" width="202" height="72" rx="16" class="violet"/>
  <text x="821" y="744" class="node-title">ddongmy-tls</text><text x="821" y="768" class="node-sub">TLS Secret</text>
  <rect x="958" y="586" width="202" height="96" rx="16" class="card"/>
  <text x="1059" y="620" class="node-title">web-service</text><text x="1059" y="645" class="node-sub">ClusterIP</text><text x="1059" y="666" class="node-sub">80 → 3000</text>
  <rect x="1196" y="574" width="232" height="120" rx="17" class="cyan"/>
  <text x="1312" y="608" class="node-title">web Pods ×2</text><text x="1312" y="634" class="node-sub">Next.js :3000</text><text x="1312" y="657" class="node-sub">startup · ready · live</text><text x="1312" y="678" class="node-sub">SA token disabled</text>
  <rect x="1196" y="724" width="232" height="94" rx="16" class="cyan"/>
  <text x="1312" y="756" class="node-title">Deployment · web-app</text><text x="1312" y="781" class="node-sub">replicas 2 · RollingUpdate</text><text x="1312" y="802" class="node-sub">0 unavailable · +1 surge</text>
  <rect x="1462" y="574" width="190" height="116" rx="16" class="violet"/>
  <text x="1557" y="606" class="node-title">App Secrets</text><text x="1557" y="632" class="node-sub">web-app-notion</text><text x="1557" y="654" class="node-sub">web-app-r2</text><text x="1557" y="676" class="node-sub">env injection</text>

  <rect x="720" y="882" width="202" height="94" rx="16" class="card"/>
  <text x="821" y="914" class="node-title">status-exporter</text><text x="821" y="940" class="node-sub">Service · ClusterIP</text><text x="821" y="962" class="node-sub">:8080 · internal only</text>
  <rect x="958" y="872" width="202" height="114" rx="16" class="blue"/>
  <text x="1059" y="904" class="node-title">Deployment + Pod</text><text x="1059" y="930" class="node-sub">status-exporter</text><text x="1059" y="952" class="node-sub">/healthz · /status · :8080</text><text x="1059" y="974" class="node-sub">replicas: 1</text>
  <rect x="1196" y="872" width="232" height="114" rx="16" class="violet"/>
  <text x="1312" y="903" class="node-title">Minimum RBAC</text><text x="1312" y="929" class="node-sub">ServiceAccount · Binding</text><text x="1312" y="951" class="node-sub">Role: web-app Deployment</text><text x="1312" y="973" class="node-sub">get only</text>
  <rect x="1462" y="882" width="190" height="94" rx="16" class="violet"/>
  <text x="1557" y="914" class="node-title">NetworkPolicy</text><text x="1557" y="940" class="node-sub">app=web only</text><text x="1557" y="962" class="node-sub">→ :8080</text>
  <rect x="958" y="1022" width="470" height="72" rx="16" class="card"/>
  <text x="1193" y="1052" class="node-title">Security &amp; resources</text><text x="1193" y="1077" class="node-sub">non-root · no privilege escalation · dropped capabilities · CPU/memory limits</text>

  <!-- Runtime flows -->
  <path d="M212 594V632" class="flow"/><text x="258" y="618" class="tiny">HTML · API</text>
  <path d="M320 671H360V840H438" class="flow"/><text x="379" y="825" class="tiny">HTTPS</text>
  <path d="M628 840H680V634H720" class="flow"/>
  <path d="M922 634H958" class="flow"/>
  <path d="M1160 634H1196" class="flow"/>
  <path d="M821 714V682" class="dash"/><text x="850" y="704" class="tiny">TLS</text>
  <path d="M1312 724V694" class="dash"/><text x="1353" y="713" class="tiny">manage</text>
  <path d="M1462 632H1428" class="dash"/><text x="1444" y="617" class="tiny">env</text>

  <!-- Notion and asset flows -->
  <path d="M1196 602H1168V540H350V766H320" class="edge"/><text x="728" y="526" class="tiny">Notion API read · cover update</text>
  <path d="M212 766V710" class="edge"/><text x="266" y="744" class="tiny">Webhook</text>
  <path d="M105 557H88V969H105" class="flow"/><text x="70" y="772" class="tiny" transform="rotate(-90 70 772)">Image</text>
  <path d="M212 1008V1044" class="dash"/><text x="267" y="1032" class="tiny">cache miss</text>
  <path d="M1196 670H1174V1142H350V1085H320" class="flow"/><text x="756" y="1128" class="tiny">Webhook · Sharp/WebP upload</text>

  <!-- Operations and control plane -->
  <path d="M1196 676H1168V852H821V882" class="edge"/><text x="990" y="839" class="tiny">/api/server-status → /status</text>
  <path d="M922 929H958" class="edge"/>
  <path d="M1462 929H1438V846H821V882" class="dash"/><text x="1468" y="854" class="tiny">ingress guard</text>
  <path d="M1196 929H1160" class="dash"/><text x="1178" y="914" class="tiny">token</text>
  <path d="M958 958H650V1058H628" class="edge"/><text x="779" y="1042" class="tiny">Bearer · HTTPS</text>
  <path d="M1196 955H1148V1010H650V1058H628" class="dash"/><text x="866" y="995" class="tiny">Deployment/web-app get only</text>
  <path d="M533 684V1014" class="edge"/><text x="580" y="912" class="tiny">apply desired state</text>

  <text x="900" y="1255" class="subtitle" text-anchor="middle">Overview는 단순하게, 이 상세도는 배포·트래픽·보안 경계를 실제 구성 기준으로 표현</text>
</svg>
