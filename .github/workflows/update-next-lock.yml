name: One-time Next.js Lockfile Update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-next-lock.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin Next.js and update lockfile
        run: npm install next@15.5.25 --save-exact

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/update-next-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/update-next-lock.yml
          git commit -m "chore: pin Next.js 15.5.25"
          git push
