apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/dongmin3891/ddongmy-os:5e91c58b060e27f7eb56ca50d119baf8d3df68dd
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
