apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/dongmin3891/ddongmy-os:abef0cdd77ca32429a012e1c79796bd2298cb501
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
