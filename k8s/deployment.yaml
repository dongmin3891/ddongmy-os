apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/dongmin3891/ddongmy-os:f1a9dc1eb1a0b651d66dcc4a42b7e1e9de8382b6
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
