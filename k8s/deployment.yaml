apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: default

spec:
  replicas: 2
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/dongmin3891/ddongmy-os:3b21718f0bd052b4e79c0c11e7e2db4c5f26869f
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          env:
            - name: NETDATA_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NETDATA_BASE_URL
              value: http://$(NETDATA_HOST):19999
            - name: NETDATA_ROOT_DISK_CHART
              value: disk_space./
            - name: NETDATA_TEMPERATURE_CHART
              value: sensors.temperature_coretemp-isa-0000_temp1_Package_id_0_input
            - name: STATUS_EXPORTER_BASE_URL
              value: http://status-exporter:8080
            - name: NOTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-app-notion
                  key: NOTION_TOKEN
                  optional: true
            - name: NOTION_DATA_SOURCE_ID
              valueFrom:
                secretKeyRef:
                  name: web-app-notion
                  key: NOTION_DATA_SOURCE_ID
                  optional: true
            - name: NOTION_WEBHOOK_VERIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-app-notion
                  key: NOTION_WEBHOOK_VERIFICATION_TOKEN
                  optional: true
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: web-app-r2
                  key: R2_ACCOUNT_ID
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: web-app-r2
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: web-app-r2
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: web-app-r2
                  key: R2_BUCKET
                  optional: true
            - name: R2_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: web-app-r2
                  key: R2_PUBLIC_URL
                  optional: true
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
