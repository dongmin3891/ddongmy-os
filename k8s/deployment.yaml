apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/dongmin3891/ddongmy-os:3c837e42ea7c89d71d1a72d52b3af562fad52695
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
