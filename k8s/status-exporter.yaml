apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-exporter
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: status-exporter-reader
  namespace: default
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - web-app
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: status-exporter-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: status-exporter
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: status-exporter-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-exporter-argocd-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - ddongmy-os
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-exporter-argocd-reader
subjects:
  - kind: ServiceAccount
    name: status-exporter
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-exporter-argocd-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-exporter
  template:
    metadata:
      labels:
        app: status-exporter
    spec:
      serviceAccountName: status-exporter
      containers:
        - name: status-exporter
          image: ghcr.io/dongmin3891/ddongmy-os:status-exporter-e04e581560a553637cee5ce05d978eb85991ca01
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: status-exporter
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: status-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-exporter-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: status-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8080
