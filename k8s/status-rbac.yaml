apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-app-status
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-app-status-reader
  namespace: default
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - web-app
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-app-status-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: web-app-status
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-app-status-reader
